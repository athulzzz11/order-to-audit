# docker compose up --build   ->  http://localhost:8000  (logins in README)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ota
      POSTGRES_DB: ota
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ota"]
      interval: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ota:ota@db:5432/ota
      SECRET_KEY: change-me-in-production
      TZ: Asia/Kolkata
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
